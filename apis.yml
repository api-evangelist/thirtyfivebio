name: ThirtyFiveBio
description: >-
  ThirtyFiveBio is an Oxford, UK biotechnology company founded in 2021 to develop
  first-in-class small-molecule inhibitors of G protein-coupled receptor 35 (GPR35)
  for the treatment of gastrointestinal diseases, including ulcerative colitis,
  inflammatory bowel disease, and digestive-tract cancers. The company was incubated
  by the M:M Bio (Molecule to Medicine) drug-discovery ecosystem together with Canaan
  Partners, and is backed by AbbVie Ventures, Mayewell Capital, and Innovate UK. It is
  a preclinical drug-discovery company with plans for first-in-human trials, not a
  software or API provider; this profile carries no developer API surface.
